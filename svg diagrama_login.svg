<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
    </marker>
    <style>
      .part { fill:#f2f8ff; stroke:#2b6cb0; stroke-width:1.2px; }
      .ptext { font-size:14px; fill:#072d4b; font-weight:700; }
      .lifeline { stroke:#999; stroke-dasharray:4 3; stroke-width:1.2px; }
      .msg { stroke:#000; stroke-width:1.1px; marker-end:url(#arrow); fill:none; }
      .label { font-size:12px; fill:#000; }
      .box { rx:4; ry:4; }
      .note { font-size:12px; fill:#333; }
    </style>
  </defs>

  <!-- Participants -->
  <g transform="translate(40,30)">
    <!-- FrmLogin -->
    <rect class="part box" x="0" y="0" width="120" height="36"/>
    <text class="ptext" x="60" y="23" text-anchor="middle">FrmLogin</text>
    <!-- BLL.Usuario -->
    <rect class="part box" x="160" y="0" width="120" height="36"/>
    <text class="ptext" x="220" y="23" text-anchor="middle">BLL.Usuario</text>
    <!-- DAL.MP_Usuario -->
    <rect class="part box" x="320" y="0" width="140" height="36"/>
    <text class="ptext" x="390" y="23" text-anchor="middle">DAL.MP_Usuario</text>
    <!-- DAL.ACCESO -->
    <rect class="part box" x="490" y="0" width="120" height="36"/>
    <text class="ptext" x="550" y="23" text-anchor="middle">DAL.ACCESO</text>
    <!-- DB -->
    <rect class="part box" x="640" y="0" width="80" height="36"/>
    <text class="ptext" x="680" y="23" text-anchor="middle">DB</text>
    <!-- CryptoManager -->
    <rect class="part box" x="740" y="0" width="160" height="36"/>
    <text class="ptext" x="820" y="23" text-anchor="middle">BLL.CryptoManager</text>
    <!-- SessionManager -->
    <rect class="part box" x="920" y="0" width="160" height="36"/>
    <text class="ptext" x="1000" y="23" text-anchor="middle">BLL.SessionManager</text>
    <!-- FrmApp -->
    <rect class="part box" x="40" y="0" width="120" height="36" opacity="0" />
    <rect class="part box" x="1090" y="0" width="90" height="36"/>
    <text class="ptext" x="1135" y="23" text-anchor="middle">FrmApp</text>
    <!-- MessageBox (visual) -->
    <rect class="part box" x="1090" y="60" width="90" height="36" opacity="0" />
    <rect class="part box" x="1090" y="0" width="90" height="36" opacity="0" />
    <rect class="part box" x="1090" y="0" width="90" height="36" opacity="0" />
  </g>

  <!-- Lifelines -->
  <!-- positions correspond to participant x + offset -->
  <!-- FrmLogin lifeline -->
  <line class="lifeline" x1="100" y1="80" x2="100" y2="810" />
  <!-- BLL.Usuario -->
  <line class="lifeline" x1="260" y1="80" x2="260" y2="810" />
  <!-- DAL.MP_Usuario -->
  <line class="lifeline" x1="400" y1="80" x2="400" y2="810" />
  <!-- DAL.ACCESO -->
  <line class="lifeline" x1="540" y1="80" x2="540" y2="810" />
  <!-- DB -->
  <line class="lifeline" x1="680" y1="80" x2="680" y2="810" />
  <!-- CryptoManager -->
  <line class="lifeline" x1="820" y1="80" x2="820" y2="810" />
  <!-- SessionManager -->
  <line class="lifeline" x1="1000" y1="80" x2="1000" y2="810" />
  <!-- FrmApp -->
  <line class="lifeline" x1="1140" y1="80" x2="1140" y2="810" />

  <!-- Messages (vertical spacing step = 50) -->
  <!-- 1 Validar campos -->
  <g>
    <text class="label" x="80" y="110">Validar campos `txtUsuario` y `txtClave`</text>
  </g>

  <!-- 2 FrmLogin -> BLL.Usuario : Listar() -->
  <g>
    <line class="msg" x1="120" y1="140" x2="240" y2="140" />
    <text class="label" x="180" y="132" text-anchor="middle">Listar()</text>
  </g>

  <!-- 3 BLL.Usuario -> DAL.MP_Usuario : Listar() -->
  <g>
    <line class="msg" x1="280" y1="190" x2="380" y2="190" />
    <text class="label" x="330" y="182" text-anchor="middle">Listar()</text>
  </g>

  <!-- 4 DAL.MP_Usuario -> DAL.ACCESO : Abrir(); Leer("LISTAR_USUARIO") -->
  <g>
    <line class="msg" x1="420" y1="240" x2="520" y2="240" />
    <text class="label" x="470" y="232" text-anchor="middle">Abrir(); Leer("LISTAR_USUARIO")</text>
  </g>

  <!-- 5 ACCESO -> DB : Ejecutar SP -->
  <g>
    <line class="msg" x1="560" y1="290" x2="660" y2="290" />
    <text class="label" x="610" y="282" text-anchor="middle">Ejecutar SP "LISTAR_USUARIO"</text>
  </g>

  <!-- 6 DB --> ACCESO : DataTable -->
  <g>
    <line class="msg" x1="660" y1="330" x2="560" y2="330" stroke-dasharray="2 2" marker-end=""/>
    <text class="label" x="610" y="322" text-anchor="middle">DataTable (filas)</text>
  </g>

  <!-- 7 ACCESO -> DAL.MP_Usuario : DataTable -->
  <g>
    <line class="msg" x1="520" y1="370" x2="400" y2="370" stroke-dasharray="2 2" marker-end=""/>
    <text class="label" x="460" y="362" text-anchor="middle">DataTable</text>
  </g>

  <!-- 8 DAL.MP_Usuario -> BLL.Usuario : List<Usuario> -->
  <g>
    <line class="msg" x1="380" y1="410" x2="260" y2="410" stroke-dasharray="2 2" marker-end=""/>
    <text class="label" x="320" y="402" text-anchor="middle">List<Usuario></text>
  </g>

  <!-- 9 BLL.Usuario -> FrmLogin : lista -->
  <g>
    <line class="msg" x1="240" y1="450" x2="120" y2="450" stroke-dasharray="2 2" marker-end=""/>
    <text class="label" x="180" y="442" text-anchor="middle">lista de usuarios</text>
  </g>

  <!-- 10 FrmLogin busca usuario -->
  <g>
    <text class="label" x="80" y="490">Buscar usuario por nombre (FirstOrDefault)</text>
  </g>

  <!-- 11 FrmLogin -> CryptoManager : Hash(txtClave.Text) -->
  <g>
    <line class="msg" x1="120" y1="540" x2="800" y2="540" />
    <text class="label" x="460" y="532" text-anchor="middle">Hash(txtClave.Text)</text>
  </g>

  <!-- 12 CryptoManager -> FrmLogin : claveCifradaIngresada -->
  <g>
    <line class="msg" x1="800" y1="580" x2="120" y2="580" stroke-dasharray="2 2" marker-end=""/>
    <text class="label" x="460" y="572" text-anchor="middle">claveCifradaIngresada</text>
  </g>

  <!-- 13 Comparación y resultado -->
  <g>
    <text class="label" x="80" y="620">Comparar uEncontrado.Clave == claveCifradaIngresada</text>
  </g>

  <!-- 14 Si coincide: FrmLogin -> SessionManager : Login(uEncontrado) -->
  <g>
    <line class="msg" x1="120" y1="660" x2="980" y2="660" />
    <text class="label" x="550" y="652" text-anchor="middle">Login(uEncontrado)</text>
    <line class="msg" x1="980" y1="700" x2="980" y2="720" stroke-dasharray="1 0" />
    <text class="label" x="1000" y="692" >Crear singleton, set Usuario y FechaInicio</text>
  </g>

  <!-- 15 Mensaje éxito y abrir FrmApp -->
  <g>
    <line class="msg" x1="120" y1="760" x2="1140" y2="760" />
    <text class="label" x="630" y="752" text-anchor="middle">new FrmApp(); Show()</text>

    <text class="label" x="160" y="800">Mostrar "Ingreso exitoso."</text>
    <text class="label" x="160" y="820">FrmLogin.Hide()</text>
  </g>

  <!-- 16 Si no coincide / no encontrado: Mensaje de error (representado como nota) -->
  <g>
    <rect x="300" y="740" width="480" height="70" rx="6" fill="#fff7f0" stroke="#c05621" />
    <text class="note" x="340" y="765">Si no coincide o no existe: MessageBox.Show("Usuario y/o Clave incorrecta o inexistente.")</text>
  </g>
</svg>